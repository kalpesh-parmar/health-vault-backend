upstream ai_service {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Rate limit zone definition: 10 requests per second floor
limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=10r/s;

server {
    listen 80;
    server_name ai.healthvault.internal;

    # Increase body limits for PDF document and voice audio uploads
    client_max_body_size 25M;

    # Buffer and timeout settings optimized for long-running LLM calls
    client_body_buffer_size 128k;
    proxy_connect_timeout 90;
    proxy_send_timeout 90;
    proxy_read_timeout 120; # Clamped for slow generation or Cold Ollama loads

    # Dynamic gzip compression
    gzip on;
    gzip_types application/json text/plain text/css;
    gzip_min_length 1000;

    location / {
        # Apply rate limiting
        limit_req zone=ai_limit burst=20 nodelay;

        proxy_pass http://ai_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Explicit WebSocket upgrade path for streaming chat and voice sessions
    location ~ ^/v1/(chat|voice)/ws$ {
        proxy_pass http://ai_service;
        proxy_http_version 1.1;

        # Upgrade handshake headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable response buffering for zero-latency token delivery
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
