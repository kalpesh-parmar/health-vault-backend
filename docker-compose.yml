services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pgvector-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Health_Vault_test
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: health-vault-ai-service
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/Health_Vault_test
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  pgvector_data:
