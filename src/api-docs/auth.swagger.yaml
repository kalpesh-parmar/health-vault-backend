openapi: 3.0.0
info:
  title: Auth API
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    FirebaseLoginRequest:
      type: object
      required:
        - firebaseIdToken
      properties:
        firebaseIdToken:
          type: string
        deviceToken:
          type: string
          nullable: true
        loginType:
          type: string
          enum:
            - mobile
            - social
        provider:
          type: string
          enum:
            - google
            - facebook
            - apple
            - microsoft
            - mobile
        providerToken:
          type: string

    SocialLoginRequest:
      type: object
      required:
        - provider
        - loginType
      properties:
        provider:
          type: string
          enum:
            - google
            - facebook
            - apple
            - microsoft
            - mobile
        providerToken:
          type: string
        deviceToken:
          type: string
          nullable: true
        loginType:
          type: string
          enum:
            - mobile
            - social

    AuthFailureRequest:
      type: object
      required:
        - provider
        - loginType
      properties:
        identifier:
          type: string
          example: user@gmail.com
        provider:
          type: string
          enum:
            - google
            - facebook
            - apple
            - microsoft
            - mobile
        loginType:
          type: string
          enum:
            - mobile
            - social

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

paths:
  /auth/firebase-login:
    post:
      tags:
        - Auth
      summary: Firebase Mobile Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirebaseLoginRequest"
            examples:
              mobileLogin:
                value:
                  firebaseIdToken: "firebase-token"
                  deviceToken: "DEVICE_TOKEN"
                  provider: "mobile"
                  loginType: "mobile"
      responses:
        "200":
          description: Login Success
        "401":
          description: Login blocked

  /auth/social-login:
    post:
      tags:
        - Auth
      summary: Social Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialLoginRequest"
            examples:
              google:
                value:
                  provider: google
                  providerToken: "google-id-token"
                  deviceToken: "DEVICE_TOKEN"
                  loginType: social
              facebook:
                value:
                  provider: facebook
                  providerToken: "facebook-access-token"
                  deviceToken: "DEVICE_TOKEN"
                  loginType: social
              microsoft:
                value:
                  provider: microsoft
                  providerToken: "microsoft-id-token"
                  deviceToken: "DEVICE_TOKEN"
                  loginType: social
      responses:
        "200":
          description: Login Success
        "401":
          description: Login blocked

  /auth/auth-failure:
    post:
      tags:
        - Auth
      summary: Report Failed Authentication Attempt
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthFailureRequest"
            examples:
              mobileFailure:
                value:
                  identifier: "9876543210"
                  provider: "mobile"
                  loginType: "mobile"
              googleFailure:
                value:
                  identifier: "user@gmail.com"
                  provider: "google"
                  loginType: "social"
      responses:
        "200":
          description: Failed attempt recorded
        "401":
          description: Account blocked after max attempts

  /auth/refresh-token:
    post:
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Token refreshed

  /auth/logout:
    post:
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout success
