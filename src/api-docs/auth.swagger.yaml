openapi: 3.0.0
info:
  title: Auth API
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        deviceToken:
          type: string
          nullable: true

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    VerifyOtpRequest:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
        otp:
          type: string

    ResetPasswordRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    FirebaseLoginRequest:
      type: object
      properties:
        deviceToken:
          type: string
          nullable: true
        # firebaseToken:
        #   type: string
        firebaseIdToken:
          type: string

    SocialLoginRequest:
      type: object
      required: [provider]
      properties:
        deviceToken:
          type: string
          nullable: true
        provider:
          type: string
          enum: [google, facebook, apple, email, mobile, microsoft]
        providerToken:
          type: string
      examples:
        google:
          summary: Google social login
          value:
            provider: google
            token: "your-google-id-token"
            deviceToken: "DEVICE_TOKEN"
        facebook:
          summary: Facebook social login
          value:
            provider: facebook
            token: "your-facebook-access-token"
            deviceToken: "DEVICE_TOKEN"
        microsoft:
          summary: Microsoft social login
          value:
            provider: microsoft
            token: "your-microsoft-id-token"
            deviceToken: "DEVICE_TOKEN"
        microsoftDummy:
          summary: Microsoft dummy login (if ENABLE_DUMMY_AUTH=true)
          value:
            provider: microsoft
            token: "dummy-microsoft-token-123"
            deviceToken: "DEVICE_TOKEN"

paths:
  /auth/firebase-login:
    post:
      tags: [Auth]
      summary: Firebase Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirebaseLoginRequest"
      responses:
        "200": { description: Success }

  /auth/social-login:
    post:
      tags: [Auth]
      summary: Social Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialLoginRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: Auth response with access and refresh tokens
