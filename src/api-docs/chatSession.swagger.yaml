openapi: 3.0.0

components:
  schemas:
    ChatSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        documentId:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        title: { type: string }
        lastMessageAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    ChatMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        citations: { type: array, items: { type: object } }
        createdAt: { type: string, format: date-time }

    CursorPage:
      type: object
      properties:
        nextCursor: { type: string, nullable: true }

    CreateChatSessionRequest:
      type: object
      properties:
        title: { type: string }
        documentId:
          type: array
          items:
            type: string
            format: uuid

    ChatMentionItem:
      type: object
      required: [documentId]
      properties:
        documentId:
          type: string
          description: Unique identifier of the mentioned document or report
        displayName:
          type: string
          description: Display name of the document shown in chat UI
        type:
          type: string
          enum: [DOCUMENT]
          default: DOCUMENT
          description: Mention entity type
        fileName:
          type: string
          description: Original file name of the document
        patientId:
          type: string
          format: uuid
          nullable: true
          description: Tenant patient ID if targeting dependent profile
        reportDate:
          type: string
          nullable: true
          description: Date printed or extracted from the report

    SendChatMessageRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          description: User question or conversational prompt
        sessionId:
          type: string
          format: uuid
          nullable: true
          description: Active chat session UUID
        documentId:
          type: array
          items:
            type: string
          nullable: true
          description: Explicit document UUID(s) targeting specific report(s)
        mentions:
          type: array
          items:
            $ref: "#/components/schemas/ChatMentionItem"
          nullable: true
          description: Array of structured document mentions extracted from @mentions in UI
        scopeMode:
          type: string
          enum: [SINGLE_DOCUMENT, MULTI_DOCUMENT, AUTHORIZED_HISTORY]
          nullable: true
          description: Target document retrieval scope constraint
        preferredLanguage:
          type: string
          enum: [english, gujarati, hindi, marathi, tamil]
          default: english
          description: Preferred response language
        patientId:
          type: string
          format: uuid
          nullable: true
          description: Optional profile/patient UUID constraint
        stream:
          type: boolean
          default: false
          description: Whether to stream SSE tokens
        page:
          type: integer
          minimum: 1
          default: 1
          nullable: true
        limit:
          type: integer
          minimum: 1
          nullable: true
      example:
        question: "What is my blood sugar level?"
        documentId: ["327bd14c-3f92-4c4f-b2fc-4989a0f5a83a"]
        mentions:
          - documentId: "327bd14c-3f92-4c4f-b2fc-4989a0f5a83a"
            displayName: "Apollo Blood Report"
            type: "DOCUMENT"
            fileName: "apollo_blood_report.pdf"
        scopeMode: "SINGLE_DOCUMENT"
        preferredLanguage: "english"
        sessionId: "123e4567-e89b-12d3-a456-426614174000"
        stream: true
        page: 1
        limit: 10

paths:
  /chat/session:
    post:
      tags: [Chat]
      summary: Create a new chat session
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChatSessionRequest" }
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }

    get:
      tags: [Chat]
      summary: List the current user's chat sessions
      description: Cursor-paginated by `lastMessageAt DESC, id DESC`.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ChatSession" }

  /chat/session/{id}/messages:
    get:
      tags: [Chat]
      summary: Infinite-scroll chat history
      description: |
        Returns up to `limit` messages older than `cursor` (default
        direction=before). Pass `direction=after` to fetch newer
        messages. Cursor is opaque base64url.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: direction
          schema: { type: string, enum: [before, after], default: before }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Messages page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ChatMessage" }

  /chat/session/{id}:
    delete:
      tags: [Chat]
      summary: Delete a chat session
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Session deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "SUCCESS" }
                  message: { type: string, example: "Session deleted" }

  /chat/session/{id}/clear-scope:
    post:
      tags: [Chat]
      summary: Explicitly clear active document scope on a chat session
      description: |
        Resets conversation slot document filters to AUTHORIZED_HISTORY.
        Guarded with timestamp ordering to prevent stale asynchronous clear operations
        from overriding newer document selections.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                clientTimestamp:
                  type: number
                  description: Epoch millisecond timestamp of the clear action on the client
      responses:
        "200":
          description: Scope cleared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "SUCCESS" }
                  message: { type: string, example: "Document scope updated successfully" }
                  data:
                    type: object
                    properties:
                      cleared: { type: boolean, example: true }
                      scopeMode: { type: string, example: "AUTHORIZED_HISTORY" }
                      activeDocumentIds: { type: array, items: { type: string } }

  /chat/message:
    post:
      tags: [Chat]
      summary: Send a question and get an AI answer
      description: |
        STRICT: the assistant answers ONLY from the user's uploaded
        documents (pgvector RAG). When no relevant chunk passes the
        relevance threshold, the response is the canonical text
        "Information not found in uploaded reports." and no LLM call is
        made.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendChatMessageRequest" }
      responses:
        "200":
          description: Document Selection Required (when user must select from uploaded reports)
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/ChatMessage" }
                  ai: { $ref: "#/components/schemas/ChatMessage" }
                  reply: { type: string }
                  requireSelection: { type: boolean, example: true }
                  allowMultiSelect: { type: boolean, example: true }
                  selectionType: { type: string, example: "MULTIPLE" }
                  reports:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        fileName: { type: string }
                        documentType: { type: string }
                        reportDate: { type: string }
                        createdAt: { type: string }
        "201":
          description: Answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/ChatMessage" }
                  ai: { $ref: "#/components/schemas/ChatMessage" }
                  reply: { type: string }
                  citations: { type: array, items: { type: object } }
