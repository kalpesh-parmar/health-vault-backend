openapi: 3.0.0
info:
  title: Document API
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    UuidParam:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    fileKeyParam:
      in: query
      name: fileKey
      required: true
      schema:
        type: string

  schemas:
    CreateDocumentRequest:
      type: object
      required:
        - documentType
        - s3Key
        - fileName
        - fileType
        - fileSize
        - s3Bucket
        - rawOcrData
        - extractedStructuredData
        - graphs
        - embeddingsGenerated
      properties:
        documentType:
          type: string
          enum:
            - family
            - medical_document
            - medication
            - insurance
            - other
        s3Key:
          type: string
          example: uploads/17123-report.pdf

        fileName:
          type: string
          example: blood-report.pdf
        fileSize:
          type: number
          example: 45678
        fileType:
          type: string
          example: application/pdf

        s3bucket:
          type: string
          example: patient-documents
        # fileStoragePath:
        #   type: string
        #   example: https://${bucket}.s3.amazonaws.com/${uploads/17123-report.pdf}
        rawOcrData:
          type: object
          example: {}
        extractedStructuredData:
          type: object
          example: {}
        graphs:
          type: array
          items: { type: object }
          example: []
        embeddingsGenerated:
          type: boolean
          example: true
    DocumentFilter:
      type: object
      additionalProperties: false
      properties:
        title: { type: string }
        type: { type: string }
        createdBy:
          type: string
          format: uuid
        fileName: { type: string }
        documentType: { type: string }
        fileType: { type: string }
        hospitalName: { type: string }
        doctorName: { type: string }
        search: { type: string }
    DocumentSort:
      type: object
      additionalProperties: false
      properties:
        sortBy:
          type: string
          enum:
            - title
            - type
            - createdBy
            - fileName
            - documentType
            - fileType
            - hospitalName
            - doctorName
            - reportDate
            - createdAt
            - updatedAt
        orderBy:
          type: string
          enum: [asc, desc]
    ListDocumentsRequest:
      type: object
      additionalProperties: false
      properties:
        filter:
          $ref: "#/components/schemas/DocumentFilter"
        sort:
          $ref: "#/components/schemas/DocumentSort"
    UpdateDocumentRequest:
      type: object
      additionalProperties: false
      properties:
        documentType: { type: string }
        fileName: { type: string }
        doctorName: { type: string, nullable: true }
        hospitalName: { type: string, nullable: true }
        reportDate: { type: string, format: date, nullable: true }
        remarks: { type: string, nullable: true }
        structuredExtractedData: { type: object, nullable: true }
    ListDocumentsPaginatedRequest:
      type: object
      additionalProperties: false

      required: [page]
      properties:
        filter:
          $ref: "#/components/schemas/DocumentFilter"
        sort:
          $ref: "#/components/schemas/DocumentSort"
        page:
          type: object
          additionalProperties: false
          required: [pageNumber, pageLimit]
          properties:
            pageNumber:
              type: integer
              minimum: 0
              example: 0
            pageLimit:
              type: integer
              minimum: 1
              maximum: 100
              example: 10

paths:
  /documents/add:
    post:
      tags: [Document]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentRequest"
      responses:
        200:
          description: File uploaded successfully

        400:
          description: Bad request
        500:
          description: Server error

  /documents/upload:
    post:
      tags: [Document]
      security:
        - bearerAuth: []
      summary: Upload user document(s) (Synchronous multi-file simple upload)
      description: Upload 1 to 5 document files for a user and store document records in the database with ocrStatus pending.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Array of 1 to 5 document files (pdf, png, jpeg, jpg, webp, tiff; max 150MB each)
      responses:
        "201":
          description: Documents uploaded and records created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  statusCode: { type: integer, example: 201 }
                  message: { type: string, example: "File uploaded successfully" }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        userId: { type: string, format: uuid }
                        fileName: { type: string, example: "lab_report.pdf" }
                        s3Key:
                          {
                            type: string,
                            example: "documents/11111111-1111-1111-1111-111111111111/uuid-lab_report.pdf",
                          }
                        s3Bucket: { type: string, nullable: true }
                        fileType: { type: string, example: "application/pdf" }
                        fileSize: { type: integer, example: 2048500 }
                        ocrStatus: { type: string, example: "pending" }
                        signedUrl: { type: string, example: "https://storage.googleapis.com/..." }
                        fileUrl: { type: string, example: "https://storage.googleapis.com/..." }
        "400":
          description: Bad request (Invalid MIME type, file size > 150MB, file count not 1..5, or invalid patientId format)
        "401":
          description: Unauthorized (Token missing/expired or patientId does not match authenticated user)
        "403":
          description: Forbidden
        "404":
          description: Patient not found

  /documents/list:
    post:
      tags: [Document]
      security:
        - bearerAuth: []
      summary: List documents with filter and sort
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListDocumentsRequest"
            examples:
              filterAndSort:
                value:
                  filter:
                    search: blood
                  sort:
                    sortBy: title
                    orderBy: asc
      responses:
        "200": { description: List }
    get:
      tags: [Document]
      security:
        - bearerAuth: []
      responses:
        "200": { description: List }

  /documents/list-paginated:
    post:
      tags: [Document]
      security:
        - bearerAuth: []
      summary: List documents with filter, sort, and 0-based pagination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListDocumentsPaginatedRequest"
            examples:
              filterSortAndPage:
                value:
                  filter:
                    search: blood
                  page:
                    pageNumber: 0
                    pageLimit: 10
                  sort:
                    sortBy: createdAt
                    orderBy: desc
      responses:
        "200": { description: Paginated list }

  /documents/{id}:
    get:
      tags: [Document]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidParam"
      responses:
        "200": { description: Found }

    delete:
      tags: [Document]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidParam"
      responses:
        "200": { description: Deleted }

  /documents/download-url:
    get:
      summary: Get download URL from S3
      tags: [Document]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/fileKeyParam"
      responses:
        "200":
          description: Download URL fetched successfully
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /documents/delete:
    delete:
      summary: Delete file from S3 using file key
      tags: [Document]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/fileKeyParam"
      responses:
        "200":
          description: File deleted successfully

  /documents/summary:
    get:
      tags: [Document]
      summary: Get document summary list for logged-in user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Document summaries fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "SUCCESS" }
                  message: { type: string, example: "Document summaries fetched successfully" }
                  data:
                    type: array
                    items: { type: object }
  /documents/update/{id}:
    put:
      tags: [Document]
      security:
        - bearerAuth: []
      summary: Update document by ID
      parameters:
        - $ref: "#/components/parameters/UuidParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentRequest"
            examples:
              updateDocument:
                value:
                  documentType: "medical_document"
                  fileName: "updated report name"
                  # doctorName: "Dr. Smith"
                  # hospitalName: "City Hospital"
      responses:
        "200":
          description: Document updated successfully
        "400":
          description: Invalid request
        "404":
          description: Document not found
