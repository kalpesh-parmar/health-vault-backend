openapi: 3.0.0

info:
  title: Medication API
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UuidParam:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    MedicationType:
      type: string
      enum:
        - TABLET
        - CAPSULE
        - SYRUP
        - DROP
        - INJECTION

    FrequencyType:
      type: string
      enum:
        - ONCE_DAILY
        - TWICE_DAILY
        - THREE_TIMES_DAILY
        - AS_NEEDED

    FoodType:
      type: string
      enum:
        - BEFORE_FOOD
        - AFTER_FOOD

    MedicationUnit:
      type: string
      enum:
        - PILLS
        - ML
        - DROPS
        - UNITS
    MedicationSchedule:
      type: object

      properties:
        MORNING:
          type: string
          example: "09:00:00"

        NOON:
          type: string
          example: "13:00:00"

        NIGHT:
          type: string
          example: "22:00:00"

        CUSTOM:
          type: array
          items:
            type: string
            example: "15:50:00"
      example:
        MORNING: "09:00:00"
        NIGHT: "22:00:00"

    Medication:
      type: object

      properties:
        id:
          type: string
          format: uuid

        userId:
          type: string
          format: uuid

        patientCode:
          type: string
          maxLength: 32
          example: PAT001

        medicationName:
          type: string
          maxLength: 255
          example: Paracetamol

        medicationType:
          $ref: "#/components/schemas/MedicationType"

        prescribedBy:
          type: string
          nullable: true
          maxLength: 255
          example: Dr. Smith

        dosePerIntake:
          type: doublePresesion
          minimum: 0.1
          example: 1

        frequency:
          $ref: "#/components/schemas/FrequencyType"
        medicationSchedule:
          $ref: "#/components/schemas/MedicationSchedule"

        foodFrequency:
          $ref: "#/components/schemas/FoodType"

        startDate:
          type: string
          format: date
          example: 2026-05-12
        ongoing:
          type: boolean
          default: false

        totalQuantity:
          type: integer
          minimum: 0
          default: 0
          example: 30

        remainingQuantity:
          type: integer
          minimum: 0
          default: 0
          example: 25

        reminderBeforeMinutes:
          type: integer
          default: 5
          example: 10
        notes:
          type: string
          nullable: true
          maxLength: 1000
          example: Take after food

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time

        softDelete:
          type: boolean
          default: false

    CreateMedicationRequest:
      type: object

      required:
        - medicationName
        - medicationType
        - frequency
        - startDate
        - medicationSchedule
        - foodFrequency

      properties:
        medicationName:
          type: string
          maxLength: 255
          example: Paracetamol

        medicationType:
          $ref: "#/components/schemas/MedicationType"

        prescribedBy:
          type: string
          nullable: true
          maxLength: 255
          example: Dr. Smith

        dosePerIntake:
          type: doublePrecision
          minimum: 0.1
          example: 1

        frequency:
          $ref: "#/components/schemas/FrequencyType"
        medicationSchedule:
          $ref: "#/components/schemas/MedicationSchedule"

        foodFrequency:
          $ref: "#/components/schemas/FoodType"

        startDate:
          type: string
          format: date
          example: 2026-05-12

        ongoing:
          type: boolean
          default: false
          example: false

        totalQuantity:
          type: integer
          minimum: 0
          default: 0
          example: 30

        reminderBeforeMinutes:
          type: integer
          default: 5
          example: 10

        notes:
          type: string
          nullable: true
          maxLength: 1000
          example: Take after food

        resolution:
          type: string
          enum:
            - REPLACE
            - KEEP_EXISTING
            - EDIT
          example: REPLACE

        replaceMedicationId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000

    UpdateMedicationRequest:
      type: object

      properties:
        medicationName:
          type: string
          maxLength: 255

        medicationType:
          $ref: "#/components/schemas/MedicationType"

        prescribedBy:
          type: string
          nullable: true
          maxLength: 255

        dosePerIntake:
          type: doublePrecision
          minimum: 0.1

        frequency:
          $ref: "#/components/schemas/FrequencyType"
        medicationSchedule:
          $ref: "#/components/schemas/MedicationSchedule"

        foodFrequency:
          $ref: "#/components/schemas/FoodType"

        startDate:
          type: string
          format: date
        ongoing:
          type: boolean
          example: true

        totalQuantity:
          type: integer
          minimum: 0

        reminderBeforeMinutes:
          type: integer
          default: 5
          example: 10

        notes:
          type: string
          nullable: true
          maxLength: 1000

        resolution:
          type: string
          enum:
            - REPLACE
            - KEEP_EXISTING
            - EDIT
          example: REPLACE

        replaceMedicationId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000

    RefillMedicationRequest:
      type: object
      required:
        - quantity

      properties:
        quantity:
          type: integer
          minimum: 1
          example: 10
          description: Quantity being added during refill

    MedicationFilter:
      type: object

      properties:
        medicationType:
          $ref: "#/components/schemas/MedicationType"

        frequency:
          $ref: "#/components/schemas/FrequencyType"

        ongoing:
          type: boolean

        search:
          type: string
          example: para

    MedicationSort:
      type: object

      properties:
        sortBy:
          type: string
          enum:
            - createdAt
            - medicationName
            - medicationType
            - frequency
            - startDate
            - updatedAt

        sortOrder:
          type: string
          enum:
            - asc
            - desc

    MedicationPagination:
      type: object

      required:
        - pageNumber
        - pageLimit

      properties:
        pageNumber:
          type: integer
          minimum: 1
          example: 1

        pageLimit:
          type: integer
          minimum: 1
          maximum: 100
          example: 10

    ListMedicationRequest:
      type: object

      properties:
        filter:
          $ref: "#/components/schemas/MedicationFilter"

        sort:
          $ref: "#/components/schemas/MedicationSort"

    ListMedicationPaginatedRequest:
      type: object

      properties:
        filter:
          $ref: "#/components/schemas/MedicationFilter"

        sort:
          $ref: "#/components/schemas/MedicationSort"

        page:
          $ref: "#/components/schemas/MedicationPagination"

    CheckDuplicateMedicationRequest:
      type: object
      required:
        - medicationName
      properties:
        medicationName:
          type: string
          example: Paracetamol 500mg
        medicationType:
          $ref: "#/components/schemas/MedicationType"

    CheckDuplicateMedicationResponse:
      type: object
      properties:
        hasDuplicate:
          type: boolean
          example: true
        conflictType:
          type: string
          enum:
            - EXACT_DUPLICATE
            - SIMILAR_NAME
          nullable: true
          example: EXACT_DUPLICATE
        matchedMedication:
          $ref: "#/components/schemas/Medication"
        matchedMedications:
          type: array
          items:
            $ref: "#/components/schemas/Medication"
        suggestedActions:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
                example: KEEP EXISTING
              label:
                type: string
                example: Keep existing medication schedule
              description:
                type: string
                example: Refill current active medication schedule

paths:
  /medications/check-duplicate:
    post:
      tags:
        - Medication
      summary: Check for duplicate active medications
      description: >
        Checks if an incoming medication name or type duplicates an existing active medication for the logged-in user.
        Returns conflict type and suggested actions.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckDuplicateMedicationRequest"
            examples:
              checkParacetamol:
                value:
                  medicationName: Tab. Paracetamol 500mg
                  medicationType: TABLET
      responses:
        "200":
          description: Duplicate check completed successfully
        "400":
          description: Invalid request payload
        "401":
          description: Unauthorized

  /medications/create:
    post:
      tags:
        - Medication

      summary: Create medication

      security:
        - bearerAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMedicationRequest"

      responses:
        "201":
          description: Medication created successfully

        "400":
          description: Bad request

        "401":
          description: Unauthorized

        "404":
          description: Patient not found

  /medications/{id}:
    get:
      tags:
        - Medication

      summary: Get medication by ID

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/UuidParam"

      responses:
        "200":
          description: Medication fetched successfully

        "401":
          description: Unauthorized

        "404":
          description: Medication not found

    put:
      tags:
        - Medication

      summary: Update medication

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/UuidParam"

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMedicationRequest"

      responses:
        "200":
          description: Medication updated successfully

        "400":
          description: Bad request

        "401":
          description: Unauthorized

        "404":
          description: Medication not found

    delete:
      tags:
        - Medication

      summary: Delete medication

      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/UuidParam"

      responses:
        "200":
          description: Medication deleted successfully

        "401":
          description: Unauthorized

        "404":
          description: Medication not found

  /medications/refill/{id}:
    post:
      tags:
        - Medication

      summary: Refill medication quantity

      description: >
        Adds new quantity to an existing medication,
      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/UuidParam"

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefillMedicationRequest"

            example:
              quantity: 10

      responses:
        "200":
          description: Medication refilled successfully

        "400":
          description: Invalid quantity

        "401":
          description: Unauthorized

        "404":
          description: Medication not found

  /medications/list:
    get:
      tags:
        - Medication

      summary: Get all medications list

      security:
        - bearerAuth: []

      responses:
        "200":
          description: Medication list fetched successfully

        "401":
          description: Unauthorized

    post:
      tags:
        - Medication

      summary: Filter medication list for logged-in user

      security:
        - bearerAuth: []

      requestBody:
        required: false

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListMedicationRequest"

            examples:
              filterSearch:
                value:
                  filter:
                    search: para

                  sort:
                    sortBy: createdAt
                    sortOrder: desc

      responses:
        "200":
          description: Filtered medication list fetched successfully

        "401":
          description: Unauthorized

  /medications/list-paginated:
    post:
      tags:
        - Medication

      summary: Paginated medication list for logged-in user

      description: >
        Returns only medications belonging to the authenticated user
        based on JWT token userId.

      security:
        - bearerAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListMedicationPaginatedRequest"

            examples:
              filterSortPagination:
                value:
                  filter:
                    medicationType: TABLET

                  sort:
                    sortBy: createdAt
                    sortOrder: desc

                  page:
                    pageNumber: 1
                    pageLimit: 10

      responses:
        "200":
          description: Paginated medication list fetched successfully

        "401":
          description: Unauthorized

        "404":
          description: User not found
