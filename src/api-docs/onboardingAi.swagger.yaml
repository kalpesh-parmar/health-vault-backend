openapi: 3.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /v1/ocr/extract:
    post:
      tags: [Intelligent Onboarding]
      summary: Extract user details from uploaded medical document (synchronous)
      description: |
        Uploads a medical report document, runs OCR + AI extraction synchronously,
        and extracts structured patient information (first/last name, gender, DOB, blood group, allergies)
        to pre-fill signup/onboarding details.
        Supports PDF or image medical reports, including graphical charts such as ECG / cardiogram images.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Medical report (PDF or Image) to extract data from
      responses:
        "202":
          description: Document processing started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  message:
                    type: string
                    example: Document processing started
                  data:
                    type: object
                    properties:
                      document:
                        type: object
                        description: Uploaded document details
                      ocr:
                        type: object
                      structuredData:
                        type: object
                        description: Pre-filled patient fields

  /v1/ocr/status/{documentId}:
    get:
      tags: [OCR]
      summary: Get the OCR processing status for a specific document
      description: |
        Retrieves the current status of an ongoing or completed OCR job for the provided document ID.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: documentId
          required: true
          schema:
            type: string
            format: uuid
          description: The unique identifier of the document
      responses:
        "200":
          description: Successfully retrieved OCR status
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: "123e4567-e89b-12d3-a456-426614174000"
                  status:
                    type: string
                    example: "COMPLETED"
                  stage:
                    type: string
                    example: "COMPLETED"
                  percentage:
                    type: integer
                    example: 100
                  currentStep:
                    type: string
                    example: "Extraction finished"
                  completedSteps:
                    type: integer
                    example: 5
                  pendingSteps:
                    type: integer
                    example: 0
                  rawOcrData:
                    type: object
                    nullable: true
                  extractedStructuredData:
                    type: object
                    nullable: true
                  error:
                    type: string
                    nullable: true
        "401":
          description: Unauthorized
        "404":
          description: Document or OCR job not found
        "500":
          description: Internal server error

  /v1/ocr/cancel/{documentId}:
    post:
      tags: [OCR]
      summary: Cancel an ongoing OCR job for a specific document
      description: |
        Cancels the background OCR processing for the specified document ID if it has not yet completed.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: documentId
          required: true
          schema:
            type: string
            format: uuid
          description: The unique identifier of the document
      responses:
        "200":
          description: OCR job successfully cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "OCR processing cancelled successfully"
        "400":
          description: OCR job cannot be cancelled (e.g., already completed)
        "401":
          description: Unauthorized
        "404":
          description: Document or OCR job not found
        "500":
          description: Internal server error

  /v1/onboarding/chat:
    post:
      tags: [Intelligent Onboarding]
      summary: Intelligent onboarding chat interaction with state persistence
      description: |
        Interact with the onboarding AI chat assistant to complete missing details.
        The flow supports Social Merge, Optional Details (Email, Blood Group, Allergies, Medical Conditions), and Prescription Medicine Confirmation.
        **State is automatically saved to the database after each interaction**,
        allowing users to resume onboarding if they close and reopen the app.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, state]
              properties:
                message:
                  type: string
                  description: User message/response to the AI question
                  example: "English"
                history:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                state:
                  type: object
                  description: Onboarding state dictionary to track missing fields
                  example:
                    { "firstName": null, "lastName": null, "gender": null, "dateOfBirth": null }
      responses:
        "200":
          description: AI response and updated state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  data:
                    type: object

  /v1/onboarding/status:
    get:
      tags: [Intelligent Onboarding]
      summary: Get current onboarding status and resumable state
      description: |
        Retrieves the current onboarding status for the user.
        Returns the current step and saved state data if onboarding is incomplete,
        or completion status if already done.
        Useful for resuming onboarding when user reopens the app.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current onboarding status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  data:
                    type: object
                    properties:
                      isOnboardingCompleted:
                        type: boolean
                        description: Whether onboarding is already completed
                        example: false
                      currentStep:
                        type: string
                        description: Current step in the onboarding process
                        example: "ASK_LANGUAGE"
                      resumableState:
                        type: object
                        nullable: true
                        description: Complete onboarding state for resumption
                        properties:
                          preferredLanguage:
                            type: string
                            enum: [english, gujarati, hindi, marathi, tamil]
                          flowMode:
                            type: string
                            enum: [UPLOAD, MANUAL]
                          currentStep:
                            type: string
                          existingUserData:
                            type: object

  /v1/onboarding/history:
    get:
      tags: [Intelligent Onboarding]
      summary: Get onboarding chat interaction history
      description: |
        Retrieves the onboarding chat history for the user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Onboarding chat history fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  data:
                    type: array
                    items:
                      type: object
