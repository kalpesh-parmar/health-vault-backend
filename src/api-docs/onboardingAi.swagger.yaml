openapi: 3.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /v1/ocr/extract:
    post:
      tags: [Intelligent Onboarding]
      summary: Extract user details from uploaded medical document (synchronous)
      description: |
        Uploads a medical report document, runs OCR + AI extraction synchronously,
        and extracts structured patient information (first/last name, gender, DOB, blood group, allergies)
        to pre-fill signup/onboarding details.
        Supports PDF or image medical reports, including graphical charts such as ECG / cardiogram images.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Medical report (PDF or Image) to extract data from
      responses:
        "200":
          description: Successful extraction
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  data:
                    type: object
                    properties:
                      document:
                        type: object
                      ocr:
                        type: object
                      structuredData:
                        type: object
                        description: Pre-filled patient fields

  /v1/onboarding/chat:
    post:
      tags: [Intelligent Onboarding]
      summary: Intelligent onboarding chat interaction with state persistence
      description: |
        Interact with the onboarding AI chat assistant to complete missing details.
        The flow supports Social Merge, Optional Details (Email, Blood Group, Allergies, Medical Conditions), and Prescription Medicine Confirmation.
        **State is automatically saved to the database after each interaction**,
        allowing users to resume onboarding if they close and reopen the app.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, state]
              properties:
                message:
                  type: string
                  description: User message/response to the AI question
                  example: "English"
                history:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                state:
                  type: object
                  description: Onboarding state dictionary to track missing fields
                  example:
                    { "firstName": null, "lastName": null, "gender": null, "dateOfBirth": null }
      responses:
        "200":
          description: AI response and updated state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  data:
                    type: object

  /v1/onboarding/status:
    get:
      tags: [Intelligent Onboarding]
      summary: Get current onboarding status and resumable state
      description: |
        Retrieves the current onboarding status for the user.
        Returns the current step and saved state data if onboarding is incomplete,
        or completion status if already done.
        Useful for resuming onboarding when user reopens the app.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current onboarding status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  data:
                    type: object
                    properties:
                      isOnboardingCompleted:
                        type: boolean
                        description: Whether onboarding is already completed
                        example: false
                      currentStep:
                        type: string
                        description: Current step in the onboarding process
                        example: "ASK_LANGUAGE"
                      resumableState:
                        type: object
                        nullable: true
                        description: Complete onboarding state for resumption
                        properties:
                          preferredLanguage:
                            type: string
                            enum: [english, gujarati, hindi, marathi, tamil]
                          flowMode:
                            type: string
                            enum: [UPLOAD, MANUAL]
                          currentStep:
                            type: string
                          existingUserData:
                            type: object
