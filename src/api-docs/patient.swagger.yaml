openapi: 3.0.0
info:
  title: Patient API
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    UuidParam:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    CreatePatientRequest:
      type: object
      required: [firstName, lastName, email, password, gender, phone]
      properties:
        profileImageKey:
          type: string
          nullable: true
          description: Uploaded profile image file key
          example: profile_image/171637282-image.png
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        email:
          type: string
          example: john.doe@example.com
        password:
          type: string
          example: Password123!
        gender:
          type: string
          enum: [female, male]
          example: male
        dateOfBirth:
          type: string
          format: date
        phone: { type: string }
        bloodGroup: { type: string }
        allergies: { type: array, items: { type: string } }

    UpdatePatientRequest:
      type: object
      properties:
        profileImageKey:
          type: string
          nullable: true
          description: Optional profile picture upload
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          example: EMAIL_ADDRESS
        gender:
          type: string
          enum: [female, male]
        # password:
        #   type: string
        phone:
          type: string
        dateOfBirth:
          type: string
          format: date
        # status:
        #   type: string
        #   enum: [ACTIVE, INACTIVE, BLOCKED]
        allergies:
          type: string
        bloodGroup:
          type: string

paths:
  /patient/add:
    post:
      tags: [Patient]
      security: []
      summary: Create patient
      description: Create patient using uploaded profile image fileKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientRequest"
      responses:
        "201":
          description: Patient created successfully
        "400":
          description: Invalid request
        "409":
          description: Email already exists

  /patient/list:
    get:
      tags: [Patient]
      security:
        - bearerAuth: []
      responses:
        "200": { description: List }

  /patient/{id}:
    get:
      tags: [Patient]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidParam"
      responses:
        "200": { description: Found }

    put:
      tags: [Patient]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientRequest"
      responses:
        "200": { description: Updated }

  /patient/soft-delete/{id}:
    delete:
      tags: [Patient]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidParam"
      responses:
        "200": { description: Deleted }

  /patient/hard-delete/{id}:
    delete:
      tags: [Patient]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidParam"
      responses:
        "200": { description: Permanently deleted }

  /patient/profile:
    get:
      tags: [Patient]
      security:
        - bearerAuth: []
      responses:
        "200": { description: Patient profile fetched }

  /patient/{patientId}/profile/upload:
    post:
      tags: [Patient]
      security:
        - bearerAuth: []
      summary: Upload patient profile image (Synchronous simple upload)
      description: Upload a single profile image for a patient. Replaces existing profile picture and updates patient's profileImageKey. No AI/OCR processing.
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            type: string
            format: uuid
          description: Patient UUID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Single image file (png, jpeg, jpg, webp; max 5MB)
      responses:
        "200":
          description: Profile image uploaded and patient profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  statusCode: { type: integer, example: 200 }
                  message: { type: string, example: "File uploaded successfully" }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      patientCode: { type: string }
                      firstName: { type: string }
                      lastName: { type: string }
                      fullName: { type: string }
                      email: { type: string }
                      mobile: { type: string }
                      profileImageKey:
                        {
                          type: string,
                          example: "profiles/11111111-1111-1111-1111-111111111111/uuid-avatar.png",
                        }
                      profileImageUrl:
                        { type: string, example: "https://storage.googleapis.com/..." }
        "400":
          description: Bad request (Invalid MIME type, file size > 5MB, missing file, or invalid patientId format)
        "401":
          description: Unauthorized (Token missing/expired or patientId does not match authenticated user)
        "403":
          description: Forbidden
        "404":
          description: Patient not found

  /patient/{patientId}/documents/upload:
    post:
      tags: [Patient]
      security:
        - bearerAuth: []
      summary: Upload patient document(s) (Synchronous multi-file simple upload)
      description: Upload 1 to 5 document files for a patient and store document records in the database with ocrStatus pending. No OCR or background pipeline is enqueued.
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            type: string
            format: uuid
          description: Patient UUID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Array of 1 to 5 document files (pdf, png, jpeg, jpg, webp, tiff; max 150MB each)
      responses:
        "201":
          description: Documents uploaded and records created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  statusCode: { type: integer, example: 201 }
                  message: { type: string, example: "File uploaded successfully" }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        userId: { type: string, format: uuid }
                        fileName: { type: string, example: "lab_report.pdf" }
                        s3Key:
                          {
                            type: string,
                            example: "documents/11111111-1111-1111-1111-111111111111/uuid-lab_report.pdf",
                          }
                        s3Bucket: { type: string, nullable: true }
                        fileType: { type: string, example: "application/pdf" }
                        fileSize: { type: integer, example: 2048500 }
                        ocrStatus: { type: string, example: "pending" }
                        signedUrl: { type: string, example: "https://storage.googleapis.com/..." }
                        fileUrl: { type: string, example: "https://storage.googleapis.com/..." }
        "400":
          description: Bad request (Invalid MIME type, file size > 150MB, file count not 1..5, or invalid patientId format)
        "401":
          description: Unauthorized (Token missing/expired or patientId does not match authenticated user)
        "403":
          description: Forbidden
        "404":
          description: Patient not found
