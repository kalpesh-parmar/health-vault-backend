openapi: 3.0.0
info:
  title: Refill API
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    UuidParam:
      type: string
      format: uuid
      example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
      description: Unique identifier for the medication
    ListRefillPaginationRequest:
      type: object
      additionalProperties: false
      properties:
        filter:
          type: object
          additionalProperties: false
          properties:
            medicationId:
              type: string
              format: uuid
              example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
            beforeRefillRemainingQuantity:
              type: integer
              example: 10
            beforeRefillTotalQuantity:
              type: integer
              example: 30
            afterRefillRemainingQuantity:
              type: integer
              example: 20
            afterRefillTotalQuantity:
              type: integer
              example: 30
        sort:
          type: object
          additionalProperties: false
          properties:
            sortBy:
              type: string
              enum: ["createdAt", "updatedAt"]
            sortOrder:
              type: string
              enum: ["asc", "desc"]
        page:
          type: object
          additionalProperties: false
          properties:
            pageNumber:
              type: integer
              minimum: 1
            pageLimit:
              type: integer
              minimum: 1

paths:
  /refill/badge-count:
    get:
      tags: [Refill]
      summary: Get Refill medication count
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: medicationId
          required: true
          schema:
            type: string
          description: Medication ID
      responses:
        "200": { description: Badge count fetched }

  /refill/list:
    get:
      tags: [Refill]
      summary: Get Refill medication list
      security:
        - bearerAuth: []
      responses:
        "200": { description: Refill medication list fetched }
  /refill/list-pagination:
    post:
      tags: [Refill]
      summary: Paginated medication list for logged-in user
      security:
        - bearerAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListRefillPaginationRequest"

            examples:
              filterSortPagination:
                value:
                  filter:
                    medicationId: "7d938e27-e6d5-41b1-beea-62690ab228a2"
                    beforeRefillRemainingQuantity: 10
                    beforeRefillTotalQuantity: 30
                    afterRefillRemainingQuantity: 20
                    afterRefillTotalQuantity: 30

                  sort:
                    sortBy: createdAt
                    sortOrder: desc

                  page:
                    pageNumber: 1
                    pageLimit: 10

      responses:
        "200":
          description: Paginated medication list fetched successfully

        "401":
          description: Unauthorized

        "404":
          description: User not found
